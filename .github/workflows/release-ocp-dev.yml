name: Release ocp-dev toolbox

on:
  push:
    branches:
      - main
    paths:
      - "ocp-dev/**"
      - ".github/workflows/build-toolbox.yml"
      - ".github/workflows/release-ocp-dev.yml"
  pull_request:
    paths:
      - "ocp-dev/**"
      - ".github/workflows/build-toolbox.yml"
      - ".github/workflows/release-ocp-dev.yml"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-toolbox.yml
    with:
      image: toolbox-ocp-dev
      context: ./ocp-dev
      containerfile: ./ocp-dev/Dockerfile
    secrets:
      GHCR_REPO: ${{ github.ref == 'refs/heads/main' && secrets.GHCR_REPO || '' }}
      GHCR_PAT: ${{ github.ref == 'refs/heads/main' && secrets.GHCR_PAT || '' }}
