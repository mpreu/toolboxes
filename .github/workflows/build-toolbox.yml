name: Build toolbox image

on:
  workflow_call:
    inputs:
      image:
        description: Image name without the registry or tag
        required: true
        type: string
      context:
        description: Build context relative to the repository root
        required: true
        type: string
      containerfile:
        description: Containerfile or Dockerfile path relative to the repository root
        required: true
        type: string
    secrets:
      GHCR_REPO:
        description: Registry namespace, needed only when publishing
        required: false
      GHCR_PAT:
        description: Registry token, needed only when publishing
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compute image metadata
        id: vars
        run: |
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ inputs.image }}
          tags: latest ${{ steps.vars.outputs.sha_short }}
          context: ${{ inputs.context }}
          containerfiles: ${{ inputs.containerfile }}
          build-args: |
            BUILD_DATE=${{ steps.vars.outputs.timestamp }}
            IMAGE_VERSION=${{ steps.vars.outputs.sha_short }}

      - name: Push to GitHub Container Registry
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ secrets.GHCR_REPO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
